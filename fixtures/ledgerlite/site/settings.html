<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ledgerlite - Settings</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">Ledgerlite</span>
    <nav class="nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="reports.html">Reports</a>
      <a href="settings.html" class="active">Settings</a>
    </nav>
    <div class="topbar-right">
      <span id="greeting" class="greeting"></span>
      <a href="#" id="logout-link">Log out</a>
    </div>
  </header>
  <main class="page narrow">
    <h1>Settings</h1>
    <section class="panel">
      <h2>Profile</h2>
      <form id="profile-form">
        <label for="display-name">Display name</label>
        <input id="display-name" name="displayName" type="text">
        <button type="submit" class="btn btn-primary">Save</button>
      </form>
      <p id="save-toast" class="toast" role="status" hidden>Saved</p>
    </section>
    <section class="panel">
      <h2>Appearance</h2>
      <label class="switch"><input id="theme-toggle" type="checkbox"> Dark theme</label>
    </section>
    <section class="panel">
      <h2>Security</h2>
      <p class="hint">Protect your account: you can enable two-factor authentication below.</p>
    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
