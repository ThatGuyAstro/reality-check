<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ledgerlite - Sign in</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <h1>Ledgerlite</h1>
    <p class="subtitle">Sign in to your books</p>
    <form id="login-form" novalidate>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <p id="login-error" class="error" role="alert" hidden>Email or password is incorrect.</p>
      <button type="submit" class="btn btn-primary">Sign in</button>
    </form>
    <a class="register-link" href="register.html">Create account</a>
  </main>
  <script src="js/auth.js"></script>
</body>
</html>
