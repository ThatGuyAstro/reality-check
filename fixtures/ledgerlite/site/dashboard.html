<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ledgerlite - Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">Ledgerlite</span>
    <nav class="nav">
      <a href="dashboard.html" class="active">Dashboard</a>
      <a href="reports.html">Reports</a>
      <a href="settings.html">Settings</a>
    </nav>
    <div class="topbar-right">
      <span id="greeting" class="greeting"></span>
      <a href="#" id="logout-link">Log out</a>
    </div>
  </header>
  <main class="page">
    <div class="page-head">
      <h1>Overview</h1>
      <div class="actions">
        <button id="sync-btn" class="btn" title="Syncs with your bank every hour. Export anytime.">Sync now</button>
        <button id="refresh-btn" class="icon-btn" aria-label="Refresh">&#x21bb;</button>
      </div>
    </div>
    <p class="last-synced">Last synced 4 minutes ago</p>
    <section class="cards">
      <article class="card"><h2>Total balance</h2><p class="amount" id="card-balance">$12,480.20</p></article>
      <article class="card"><h2>Pending</h2><p class="amount" id="card-pending">$1,210.00</p></article>
      <article class="card"><h2>This month</h2><p class="amount" id="card-month">+$3,905.75</p></article>
    </section>
    <section class="table-section">
      <div class="table-head">
        <h2>Recent transactions</h2>
        <button id="export-btn" class="btn">Export CSV</button>
      </div>
      <table class="tx-table">
        <thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Amount</th></tr></thead>
        <tbody id="tx-body"></tbody>
      </table>
      <p id="export-status" class="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
