<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings - Acme Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">Acme Tracker</div>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="settings.html" class="active">Settings</a>
      <a href="reports.html" style="display:none">Reports</a>
      <a href="index.html" id="sign-out">Sign out</a>
    </nav>
  </aside>
  <section class="main">
    <h1>Settings</h1>
    <p class="sub">Update how your name appears to teammates.</p>
    <form id="settings-form" novalidate style="max-width:420px">
      <label for="display-name">Display name</label>
      <input id="display-name" type="text">
      <button class="btn" type="submit">Save</button>
    </form>
  </section>
</div>
<div class="toast" id="toast">Settings saved</div>
<script src="js/app.js"></script>
</body>
</html>
