<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Sign in - Orbit</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="css/app.css"></head>
<body>
  <main class="auth">
    <h1>Sign in to Orbit</h1>
    <p class="sub">Your team's board, in one place.</p>
    <form id="login-form" novalidate>
      <div class="field"><label for="email">Email</label><input id="email" type="email" placeholder="you@company.com" required></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" required></div>
      <p id="login-error" class="err" role="alert" style="display:none"></p>
      <button class="btn primary" type="submit">Sign in</button>
    </form>
  </main>
  <script src="js/auth.js"></script>
</body></html>
